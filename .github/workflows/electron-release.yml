name: Electron release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match package version v$version"
          }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run desktop:package
      - run: node tests/installer-path.mjs
      - run: node tests/installer-instdir.mjs
      - run: npm run desktop:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: sunday-room-windows-installer
          path: dist-electron/Sunday-Room-*-Setup-x64.exe
          if-no-files-found: error

  prepare-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sunday-room-windows-installer
          path: installer
      - name: Create or update release installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" installer/*.exe --clobber
          else
            gh release create "$TAG_NAME" installer/*.exe --draft --verify-tag --title "Sunday Room ${TAG_NAME#v}"
          fi
