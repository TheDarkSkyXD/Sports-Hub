appId: com.sundayroom.desktop
productName: Sunday Room
# electron-builder needs a publish provider to emit latest.yml. The app sets its runtime
# feed through `autoUpdater.setFeedURL`; `--publish never` keeps packaging local.
publish:
  provider: generic
  url: https://github.com/TheDarkSkyXD/Sports-Hub/releases/latest/download
asar: true
npmRebuild: false
directories:
  output: dist-electron
files:
  - package.json
  - desktop/**
  # `!node_modules/**` keeps the dev tree out, which a blanket `node_modules/**` does not:
  # that ships all 29,000 dev packages. These are electron-updater's transitive graph,
  # listed explicitly because this app has no other production dependency and there is no
  # pattern that admits one subtree without naming it.
  # Verified rather than assumed: `tests/packaged-desktop.mjs` reads the packaged asar and
  # requires electron-updater from inside the running main process. An earlier revision of
  # this file omitted three of these and shipped an app that opened a window titled
  # "Error", which the smoke test could only report as a bare timeout.
  - '!node_modules/**'
  - node_modules/electron-updater/**
  - node_modules/builder-util-runtime/**
  - node_modules/fs-extra/**
  - node_modules/graceful-fs/**
  - node_modules/jsonfile/**
  - node_modules/universalify/**
  - node_modules/js-yaml/**
  - node_modules/lazy-val/**
  - node_modules/lodash.isequal/**
  - node_modules/lodash.escaperegexp/**
  - node_modules/semver/**
  - node_modules/debug/**
  - node_modules/ms/**
  - node_modules/sax/**
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - '**/*'
      # Dev scratch that the file tracer follows into standalone. Shipping it
      # re-embeds the previous build inside this one, so the install grows and
      # its paths outgrow what the NSIS uninstaller can rename.
      - '!dist-electron/**'
      - '!work/**'
      - '!.desktop-runtime/**'
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - '**/*'
win:
  icon: desktop/icons/sunday-room.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  differentialPackage: false
  installerIcon: desktop/icons/sunday-room.ico
  uninstallerIcon: desktop/icons/sunday-room.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: desktop/installer.nsh
artifactName: Sunday-Room-${version}-Setup-${arch}.${ext}
