appId: com.sundayroom.desktop
productName: Sunday Room
asar: true
npmRebuild: false
directories:
  output: dist-electron
files:
  - package.json
  - desktop/**
  - '!node_modules/**'
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - '**/*'
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - '**/*'
win:
  icon: desktop/icons/sunday-room.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: desktop/icons/sunday-room.ico
  uninstallerIcon: desktop/icons/sunday-room.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: desktop/installer.nsh
artifactName: Sunday-Room-${version}-Setup-${arch}.${ext}
