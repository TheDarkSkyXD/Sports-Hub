appId: com.sundayroom.desktop
productName: Sunday Room
asar: true
npmRebuild: false
directories:
  output: dist-electron
files:
  - package.json
  - desktop/**
  - '!node_modules/**'
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - '**/*'
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: Sunday-Room-${version}-Setup-${arch}.${ext}
